services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cosmos-main-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "0.0.0.0:18080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

services:
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: ${MONITORING_HOSTNAME}
      GF_SERVER_ROOT_URL: https://${MONITORING_HOSTNAME}
    volumes:
      - /srv/monitoring/data/grafana:/var/lib/grafana
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - /srv/monitoring/data/prometheus:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [monitoring]

  prometheus-reloader:
    image: alpine:3.22.1
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - while true; do sleep 30; wget -qO- --post-data='' http://prometheus:9090/-/reload >/dev/null; done
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [monitoring]

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - /srv/monitoring/data/loki:/loki
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-config.file=/etc/loki/loki.yml", "-verify-config=true"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      MONITORING_HOSTNAME: ${MONITORING_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /srv/monitoring/data/caddy/data:/data
      - /srv/monitoring/data/caddy/config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      grafana:
        condition: service_healthy
    networks: [monitoring]

networks:
  monitoring:
    driver: bridge

# chart: prometheus-community/kube-prometheus-stack 92.18.0
# Grafana 관리자 계정은 Secret grafana-admin을 사용한다. Secret discord-webhook은 Secrets Manager cosmos/monitoring/discord-webhook 값이다.
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }
prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
    enableFeatures: [exemplar-storage]
    retention: 15d
    retentionSize: 25GB
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { cpu: "2", memory: 4Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 30Gi } }
alertmanager:
  config:
    route:
      receiver: discord
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname=~"Watchdog|InfoInhibitor"
    receivers:
      - name: "null"
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/discord-webhook/url
            send_resolved: true
  alertmanagerSpec:
    secrets: [discord-webhook]
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 200m, memory: 256Mi }
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 2Gi } }
grafana:
  grafana.ini:
    server:
      root_url: https://grafana-wade.cosmoscode.site
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  persistence:
    enabled: true
    storageClassName: gp3-retain
    size: 5Gi
  sidecar:
    dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: monitoring }
    datasources:
      enabled: true
      uid: prometheus-v2
      name: Prometheus v2
      exemplarTraceIdDestinations:
        datasourceUid: tempo-wade
        traceIdLabelName: trace_id
        urlDisplayLabel: View trace
  additionalDataSources:
    - name: Loki v2
      uid: loki-v2
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '(?:trace_id|traceId)[=:\" ]+([0-9a-f]{32})'
            datasourceUid: tempo-wade
            url: '$${__value.raw}'
            urlDisplayLabel: View trace
    - name: Tempo Wade
      uid: tempo-wade
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        httpMethod: GET
        nodeGraph: { enabled: true }
        serviceMap: { datasourceUid: prometheus-v2 }
        tracesToLogsV2:
          datasourceUid: loki-v2
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          filterByTraceID: true
          filterBySpanID: false
          customQuery: false
          tags:
            - { key: service.name, value: app }
            - { key: k8s.namespace.name, value: namespace }
            - { key: k8s.pod.name, value: pod }
        tracesToMetrics:
          datasourceUid: prometheus-v2
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          tags:
            - { key: service.name, value: service }
          queries:
            - name: Request rate
              query: 'sum(rate(traces_spanmetrics_calls_total{$${__tags}}[5m]))'
            - name: Error rate
              query: 'sum(rate(traces_spanmetrics_calls_total{$${__tags},status_code="STATUS_CODE_ERROR"}[5m]))'
        traceQuery:
          timeShiftEnabled: true
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
prometheusOperator:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
kube-state-metrics:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
prometheus-node-exporter:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: otel-collector }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: prod }
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [cosmos-auth, cosmos-core, cosmos-battle, cosmos-battle-worker, cosmos-ai-llm, cosmos-ai-make-problem, cosmos-ai-problem-batch]
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 8888 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: otel-collector }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: tempo }
      ports:
        - { protocol: TCP, port: 4317 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 9090 }
    # k8sattributes processor가 EKS API를 조회한다. API endpoint 주소는 클러스터별로 달라 HTTPS만 제한한다.
    - ports:
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: tempo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/instance: otel-collector }
      ports:
        - { protocol: TCP, port: 4317 }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 3200 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/instance: tempo }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: prometheus }
      ports:
        - { protocol: TCP, port: 9090 }
    # Pod Identity Agent의 link-local credential endpoint는 HTTP 80을 사용한다.
    - to:
        - ipBlock: { cidr: 169.254.170.23/32 }
      ports:
        - { protocol: TCP, port: 80 }
    # S3 및 STS endpoint는 IP가 동적이므로 HTTPS만 제한한다.
    - ports:
        - { protocol: TCP, port: 443 }

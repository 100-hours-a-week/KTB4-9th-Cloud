# chart: open-telemetry/opentelemetry-collector 0.178.3 (Collector 0.163.2)
fullnameOverride: otel-collector
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

alternateConfig:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    k8s_attributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.job.name
          - k8s.cronjob.name
          - k8s.pod.name
          - k8s.container.name
          - k8s.node.name
    resource:
      attributes:
        - key: deployment.environment.name
          value: wade
          action: insert
        - key: k8s.cluster.name
          value: cosmos-v3-wade
          action: insert
    transform/privacy:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - delete_key(attributes, "url.query")
            - delete_key(attributes, "url.full")
            - delete_key(attributes, "http.url")
            - delete_key(attributes, "db.statement")
            - delete_key(attributes, "db.connection_string")
            - delete_key(attributes, "http.request.header.authorization")
            - delete_key(attributes, "http.request.header.cookie")
            - delete_key(attributes, "http.response.header.set-cookie")
            - delete_key(attributes, "http.request.header.x-api-key")
            - delete_key(attributes, "gen_ai.prompt")
            - delete_key(attributes, "gen_ai.completion")
            - delete_key(attributes, "gen_ai.input.messages")
            - delete_key(attributes, "gen_ai.output.messages")
            - delete_key(attributes, "gen_ai.system_instructions")
        - context: spanevent
          statements:
            - delete_key(attributes, "exception.message")
            - delete_key(attributes, "exception.stacktrace")
    batch:
      send_batch_size: 1024
      timeout: 5s
  exporters:
    otlp/tempo:
      endpoint: "tempo.monitoring.svc.cluster.local:4317"
      tls: { insecure: true }
      sending_queue:
        enabled: true
        queue_size: 2048
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_interval: 10s
        max_elapsed_time: 60s
    prometheusremotewrite:
      endpoint: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
      resource_to_telemetry_conversion: { enabled: true }
  extensions:
    health_check: { endpoint: "0.0.0.0:13133" }
  service:
    extensions: [health_check]
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus: { host: 0.0.0.0, port: 8888 }
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, resource, transform/privacy, batch]
        exporters: [otlp/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, k8s_attributes, resource, batch]
        exporters: [prometheusremotewrite]

serviceAccount:
  create: true
  name: otel-collector
  automountServiceAccountToken: true

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [pods, namespaces]
      verbs: [get, list, watch]
    - apiGroups: [apps]
      resources: [replicasets]
      verbs: [get, list, watch]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: null
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: null
    protocol: TCP
  jaeger-compact: { enabled: false }
  jaeger-thrift: { enabled: false }
  jaeger-grpc: { enabled: false }
  zipkin: { enabled: false }
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
      interval: 30s

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }
securityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
  readOnlyRootFilesystem: true

nodeSelector: { workload-class: application }
tolerations:
  - key: CriticalAddonsOnly
    operator: Equal
    value: "true"
    effect: NoSchedule

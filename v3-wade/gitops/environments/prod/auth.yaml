name: cosmos-auth
component: auth
image: 352635536602.dkr.ecr.ap-northeast-2.amazonaws.com/cosmos-v2/spring:approved-2bb0814f345743c05e0050a5d8f32a69b6db7b98
serviceAccount: auth-sa
service: { name: auth-service }
extraPorts: [{ name: management, port: 9091 }]
metrics: { enabled: true, portName: management, path: /actuator/prometheus, interval: 30s, scrapeTimeout: 10s }
env:
  SPRING_PROFILES_ACTIVE: stage
  SPRING_CONFIG_IMPORT: optional:configtree:/mnt/secrets/
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
  MANAGEMENT_SERVER_PORT: "9091"
  APP_REGION: ap-northeast-2
  APP_VERSION: v3
  FRONTEND_BASE_URL: https://wade.cosmoscode.site
  KAKAO_REDIRECT_URI: https://wade.cosmoscode.site/api/auth/oauth/kakao/callback
  SPRING_JPA_OPEN_IN_VIEW: "true"
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
  SENTRY_ENVIRONMENT: stage
  AI_SERVER_BASE_URL: http://ai-llm-service
  JUDGE0_BASE_URL: http://judge-api-service
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_VHOST: "/"
  MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
  OTEL_SERVICE_NAME: cosmos-auth
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=wade,service.namespace=cosmos,k8s.cluster.name=cosmos-v3-wade
secrets:
  - secret: cosmos/wade/spring-config
    keys: { DB_URL: DB_URL }
  - secret: cosmos/wade/main-db
    keys: { username: DB_USERNAME, password: DB_PASSWORD }
  - secret: cosmos/wade/rabbitmq
    keys: { username: spring.rabbitmq.username, password: spring.rabbitmq.password }
  - secret: /cosmos-v2/stage/spring
    keys: { kakao_client_id: KAKAO_CLIENT_ID, kakao_client_secret: KAKAO_CLIENT_SECRET, kakao_redirect_uri: KAKAO_REDIRECT_URI, jwt_secret: JWT_SECRET }
resources:
  requests: { cpu: "1", memory: 1Gi }
  limits: { cpu: "2", memory: 2Gi }
probes:
  startupProbe: { tcpSocket: { port: 8080 }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 36 }
  readinessProbe: { httpGet: { path: /actuator/health, port: 9091 }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
  livenessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
replicas: null # HPA가 관리
hpa: { enabled: true, min: 1, max: 2, cpu: 70 }

# Daily battle outbox events are consumed inside the Wade cluster.
# Credentials come from the Wade-owned Secrets Manager secret; no public management route is exposed.
name: rabbitmq
component: data
image: rabbitmq:4.1-management-alpine@sha256:71dc98bb14d16c7240efc1d9b6356e5ac1470a51c63e8cce16f246e09748a995
serviceAccount: rabbitmq-sa
replicas: 1
port: 5672
service: { name: rabbitmq, port: 5672 }
extraPorts: [{ name: management, port: 15672 }, { name: prometheus, port: 15692 }]
priorityClass: cosmos-platform-critical
nodeSelector: { workload-class: stateful }
tolerations: [{ key: workload, value: stateful, effect: NoSchedule }]
stateful: { enabled: true, storage: 5Gi, mountPath: /var/lib/rabbitmq }
command: ["sh", "-c", 'export RABBITMQ_DEFAULT_USER="$(cat /mnt/secrets/RABBITMQ_USER)" RABBITMQ_DEFAULT_PASS="$(cat /mnt/secrets/RABBITMQ_PASSWORD)" RABBITMQ_DEFAULT_VHOST="/"; exec docker-entrypoint.sh rabbitmq-server']
secrets:
  - secret: cosmos/wade/rabbitmq
    keys: { username: RABBITMQ_USER, password: RABBITMQ_PASSWORD }
resources:
  requests: { cpu: 125m, memory: 256Mi }
  limits: { cpu: "1", memory: 1Gi }
probes:
  startupProbe: { exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }, periodSeconds: 10, timeoutSeconds: 10, failureThreshold: 18 }
  readinessProbe: { exec: { command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"] }, periodSeconds: 15, timeoutSeconds: 10, failureThreshold: 3 }
  livenessProbe: { exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 3 }
metrics: { enabled: true, portName: prometheus, path: /metrics/per-object, interval: 30s, scrapeTimeout: 10s }

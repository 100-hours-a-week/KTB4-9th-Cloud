name: cosmos-ai-problem-batch
component: ai
image: 352635536602.dkr.ecr.ap-northeast-2.amazonaws.com/cosmos-v2/fastapi:approved-76f850ab691c3d8bafbca7b8aa4d51e285eaf9db
serviceAccount: ai-job-sa
port: 0
service: { enabled: false }
priorityClass: cosmos-batch
command: ["sh", "-c", 'for f in /mnt/secrets/[A-Z]*; do export "$(basename "$f")=$(cat "$f")"; done; exec python -m src.batch send']
env:
  DB_ECHO: "false"
  DB_PORT: "5432"
  DB_NAME: cosmos
  DB_HOST: ai-postgres
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  JUDGE0_URL: http://judge-api-service
  BACKEND_URL: http://core-service/api
  LANGSMITH_ENDPOINT: https://api.smith.langchain.com
  LANGSMITH_TRACING: "true"
  LANGSMITH_PROJECT: cosmos-v3-wade
  MOCK_LLM: "false"
  BATCH_ENABLED: "false"
  BATCH_TIMEZONE: Asia/Seoul
  BATCH_CONCURRENCY: "5"
  LOG_LEVEL: INFO
  OTEL_SERVICE_NAME: cosmos-ai-problem-batch
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_LOGS_EXPORTER: none
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=wade,service.namespace=cosmos,k8s.cluster.name=cosmos-v3-wade
  LLM_PRICING_USD_PER_MILLION: "{}"
  LLM_PRICING_VERSION: unconfigured-2026-11-13
  OTEL_BSP_SCHEDULE_DELAY: "1000"
  OTEL_BSP_EXPORT_TIMEOUT: "5000"
envValueFrom:
  K8S_POD_NAME: { fieldRef: { fieldPath: metadata.name } }
  K8S_POD_UID: { fieldRef: { fieldPath: metadata.uid } }
  K8S_JOB_NAME: { fieldRef: { fieldPath: "metadata.labels['batch.kubernetes.io/job-name']" } }
secrets:
  - secret: /cosmos-v2/stage/ai-postgres
    keys: { username: DB_USER, password: DB_PASSWORD }
  - secret: /cosmos-v2/stage/fastapi
    keys: { gemini_api_key: GEMINI_API_KEY, langsmith_api_key: LANGSMITH_API_KEY, admin_token: ADMIN_TOKEN }
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
cronJob: { enabled: true, schedule: "0 15 * * *", suspend: true, activeDeadlineSeconds: 1800 }
createServiceAccount: false

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-image-updater-webhook
  namespace: argocd
spec:
  parentRefs:
    - name: prod
      namespace: prod
  hostnames:
    - image-updater-wade.cosmoscode.site
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - name: argocd-image-updater
          port: 8080

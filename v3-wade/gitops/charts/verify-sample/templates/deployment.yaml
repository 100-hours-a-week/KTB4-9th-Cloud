apiVersion: apps/v1
kind: Deployment
metadata:
  name: verify-sample
  labels:
    app.kubernetes.io/part-of: cosmos
    app.kubernetes.io/name: verify-sample
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: verify-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: verify-sample
    spec:
      containers:
        - name: sample
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "echo $MESSAGE; sleep 86400"]
          env:
            - name: MESSAGE
              value: {{ .Values.message | quote }}
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }

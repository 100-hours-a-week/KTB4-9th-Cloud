{{- if .Values.rollout.enabled }}
# S1 단계 4: 카나리와 자동 롤백. 기존 Deployment를 workloadRef로 참조하고, 새 버전을 절반에 올린 뒤 5분 분석이 실패하면 되돌린다.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ .Values.name }}
  labels: {{- include "cosmos.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 5
  # 카나리 파드가 준비조차 못 하면 분석 단계에 닿지 못한다. 300초 안에 진행하지 못하면 자동으로 중단하고 안정 버전으로 되돌린다.
  progressDeadlineSeconds: 300
  progressDeadlineAbort: true
  selector:
    matchLabels: {{- include "cosmos.selector" . | nindent 6 }}
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.name }}
    scaleDown: progressively
  strategy:
    canary:
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: {{ .Values.name | trimPrefix "cosmos-" }}-health
        - setWeight: 100
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Values.name | trimPrefix "cosmos-" }}-health
  labels: {{- include "cosmos.labels" . | nindent 4 }}
spec:
  metrics:
    # 핵심 기능 오류율이 빠른 소진 기준(14.4배, 0.072) 아래
    - name: error-ratio
      interval: 1m
      count: 5
      failureLimit: 0
      successCondition: len(result) == 0 || result[0] < 0.072
      provider:
        prometheus:
          address: {{ .Values.rollout.prometheus }}
          # 트래픽이 없으면 비율이 NaN이다. NaN은 비교에서 빠지므로 0으로 채운다. max로 라벨을 없애 결과를 한 개로 만든다.
          query: max(cosmos:journey_error_ratio:rate5m{journey="core"} >= 0) or vector(0)
    # 분석 동안 core 컨테이너 재시작이 없어야 한다(OOMKilled 같은 재시작을 오류율보다 먼저 잡는다)
    - name: restarts
      interval: 1m
      count: 5
      failureLimit: 0
      successCondition: result[0] == 0
      provider:
        prometheus:
          address: {{ .Values.rollout.prometheus }}
          query: sum(increase(kube_pod_container_status_restarts_total{namespace="prod",pod=~"{{ .Values.name }}-.*"}[5m])) or vector(0)
{{- with .Values.rollout.connectionGuard }}
{{- if .enabled }}
    # S1' 단계 3: 영향 범위 카나리. 카나리 파드가 DB 연결을 더 잡아 다른 서비스가 재시작할 여유가 없어지면 사용자 영향 전에 중단한다.
    # 모든 질의는 데이터가 없을 때도 값을 돌려주고(or vector(0)), 빈 결과는 통과로 본다. 1차의 NaN 중단을 되풀이하지 않는다.
    # 전체 연결 수가 (RDS 한도 - 다른 서비스 한 번 재배포 여유) 이하여야 한다. rdsMax는 Prometheus 규칙·CI 상수와 같은 값이다.
    - name: db-connection-headroom
      interval: 1m
      count: 5
      failureLimit: 0
      successCondition: len(result) == 0 || result[0] <= {{ sub (int .rdsMax) (int .reserve) }}
      provider:
        prometheus:
          address: {{ $.Values.rollout.prometheus }}
          query: cosmos:db_connections:sum or vector(0)
    # 다른 주요 경로의 오류율이 5% 아래
    - name: other-routes-error
      interval: 1m
      count: 5
      failureLimit: 0
      successCondition: len(result) == 0 || result[0] < 0.05
      provider:
        prometheus:
          address: {{ $.Values.rollout.prometheus }}
          query: max(cosmos:journey_error_ratio_all:rate5m{journey="major"} >= 0) or vector(0)
    # auth 경로(로그인) 오류율이 5% 아래
    - name: auth-route-error
      interval: 1m
      count: 5
      failureLimit: 0
      successCondition: len(result) == 0 || result[0] < 0.05
      provider:
        prometheus:
          address: {{ $.Values.rollout.prometheus }}
          query: max(cosmos:journey_error_ratio_all:rate5m{route="journey-core-auth"} >= 0) or vector(0)
{{- end }}
{{- end }}
{{- end }}

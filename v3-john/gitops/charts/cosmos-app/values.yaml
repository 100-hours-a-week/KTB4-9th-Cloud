name: ""
component: ""
image: ""
version: ""
replicas: 1
serviceAccount: ""
createServiceAccount: true
command: []
env: {}
secrets: []
secretMountPath: /mnt/secrets
port: 8080
service: { enabled: true, name: "", port: 80 }
extraPorts: []
probes: {}
resources: {}
priorityClass: cosmos-api
nodeSelector: { workload-class: application }
tolerations: []
terminationGracePeriodSeconds: 60
# S2' 단계 1: 종료 정리. 0보다 크면 주 컨테이너에 preStop sleep을 넣어, 파드가 엔드포인트에서 빠진 뒤에 SIGTERM을 받게 한다.
# 이미지에 sh가 있어야 한다(distroless 이미지는 불가).
preStopSleepSeconds: 0
# 앱의 종료 단계 제한(Spring이면 SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE와 같은 초 단위 값). 렌더링 검사에만 쓰며 파드에는 반영되지 않는다.
# preStop이 켜져 있을 때 terminationGracePeriodSeconds가 preStopSleepSeconds + shutdownPhaseSeconds보다 크지 않으면 렌더링을 실패시킨다.
shutdownPhaseSeconds: 0
stateful: { enabled: false, storage: 30Gi, mountPath: "", storageClass: gp3-retain }
cronJob: { enabled: false, schedule: "", suspend: true, activeDeadlineSeconds: 5400 }
job: { enabled: false }
privileged: false
rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
hpa: { enabled: false, min: 1, max: 1, cpu: 70 }
metrics: { enabled: false, port: management, path: /actuator/prometheus, interval: 30s }
# 분산 트레이싱(S1 단계 2). agent가 참이면 init 컨테이너가 OTel Java 에이전트를 복사하고 JAVA_TOOL_OPTIONS에 붙인다.
# BE 이미지에는 에이전트가 없다(2026-11-20 확인). 파이썬 서비스는 SDK가 이미지에 있어 enabled만 켠다.
otel:
  enabled: false
  agent: false
  serviceName: ""
  agentImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.33.1@sha256:383a36e8d63a96435a04f2a32f0bf065f211f9ef0c6e75e9e895f0f7d272659a
# JAVA_TOOL_OPTIONS에 이어 붙일 JVM 옵션(예: -XX:MaxRAMPercentage=75).
jvmOptions: ""
# 이중화(S1 단계 3 = S2 단계 1). minAvailable이 null이면 PDB를 만들지 않는다.
pdb: { minAvailable: null }
# 참이면 같은 서비스 파드를 노드에 고르게 나눈다(hostname, maxSkew 1, ScheduleAnyway).
spread: false
# 카나리와 자동 롤백(S1 단계 4). 켜면 Argo Rollouts가 Deployment 파드를 넘겨받는다.
rollout:
  enabled: false
  prometheus: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

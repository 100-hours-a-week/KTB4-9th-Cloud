# 상태 없는 애플리케이션만 자동 동기화한다. 상태 저장 서비스와 플랫폼은 Manual Sync한다.
# 장애 주입 훈련용이라 selfHeal은 끈다. 켜 두면 주입한 장애를 Argo CD가 바로 되돌린다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: prod-services
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - { name: auth, autoSync: true }
          - { name: core, autoSync: true }
          - { name: battle, autoSync: true }
          - { name: ai-llm, autoSync: true }
          - { name: ai-make-problem, autoSync: true }
          - { name: ai-problem-batch, autoSync: true }
          - { name: ai-postgres, autoSync: false }
          - { name: mlflow, autoSync: false }
          - { name: judge-api, autoSync: false }
          - { name: judge-worker, autoSync: false }
          - { name: judge-postgres, autoSync: false }
          - { name: judge-redis, autoSync: false }
  template:
    metadata:
      name: "prod-{{ .name }}"
    spec:
      project: prod
      source:
        repoURL: https://github.com/100-hours-a-week/KTB4-9th-Cloud.git
        targetRevision: main
        path: v3-john/gitops/charts/cosmos-app
        helm:
          valueFiles:
            - "../../environments/prod/{{ .name }}.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: prod
      syncPolicy:
        syncOptions:
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
  templatePatch: |
    {{- if .autoSync }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: false
    {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-platform
  namespace: argocd
spec:
  project: prod
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-9th-Cloud.git
    targetRevision: main
    path: v3-john/gitops/environments/prod/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: prod

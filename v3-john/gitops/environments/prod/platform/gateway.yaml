apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cosmos
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: prod
  namespace: prod
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # 장애 주입 중 Envoy 파드 하나가 노드와 함께 사라져도 진입점이 남도록 2개를 둔다.
        replicas: 2
        container:
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
        pod:
          nodeSelector: { workload-class: application }
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: prod
                  gateway.envoyproxy.io/owning-gateway-namespace: prod
      envoyService:
        type: LoadBalancer
        loadBalancerClass: service.k8s.aws/nlb
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-scheme: internal
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-name: cosmos-v3-john
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: prod
  namespace: prod
spec:
  gatewayClassName: cosmos
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: prod
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [prod, argocd, monitoring]
---
# 설계서 6.1의 기능 묶음(핵심, 주요, 부가)별로 HTTPRoute를 나눈다. 목적지는 그대로다.
# Envoy는 라우트 이름으로 메트릭을 나누므로(httproute/prod/<이름>/rule/N) 이름이 곧 SLO 집계 단위다.
# 이름 규칙: journey-<묶음>-<기능>. 묶음은 core, major, ai 중 하나다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: journey-core-auth
  namespace: prod
spec:
  parentRefs:
    - name: prod
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/auth }
        - path: { type: PathPrefix, value: /auth }
      backendRefs:
        - { name: auth-service, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: journey-core-problem
  namespace: prod
spec:
  parentRefs:
    - name: prod
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/problems }
        - path: { type: PathPrefix, value: /api/daily-problems }
      backendRefs:
        - { name: core-service, port: 80 }
---
# /api/problems/{id}/... 아래 경로라 접두사로는 문제 조회와 구분되지 않는다. 정규식으로 따로 잡는다.
# Envoy Gateway는 정규식 경로를 접두사 경로보다 먼저 맞춘다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: journey-core-submit
  namespace: prod
spec:
  parentRefs:
    - name: prod
  rules:
    - matches:
        - path: { type: RegularExpression, value: "/api/problems/[^/]+/code-submissions(/.*)?" }
      backendRefs:
        - { name: core-service, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: journey-ai
  namespace: prod
spec:
  parentRefs:
    - name: prod
  rules:
    - matches:
        - path: { type: RegularExpression, value: "/api/problems/[^/]+/(hints|solution-submissions)(/.*)?" }
        - path: { type: PathPrefix, value: /api/solution-evaluations }
      backendRefs:
        - { name: core-service, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: journey-major-battle
  namespace: prod
spec:
  parentRefs:
    - name: prod
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/daily-battles }
      backendRefs:
        - { name: battle-service, port: 80 }
---
# 랭킹, 알림과 SSE, 활동 기록과 위에서 잡히지 않은 나머지 /api 경로다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: journey-major-core
  namespace: prod
spec:
  parentRefs:
    - name: prod
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - { name: core-service, port: 80 }
---
# S1' 단계 2(2026-11-24): 제출 경로 격벽. 제출 요청은 채점 결과를 기다리는 동안 core DB 연결을 쥔다.
# 채점이 멈추면 제출이 core 풀(파드당 10)을 다 잡아 문제 조회·major-core까지 5xx가 난다(records/s1p-pilot.md).
# Envoy 한 대당 제출 동시 요청을 8로 묶어, 넘치는 제출은 Envoy가 바로 503으로 돌려보낸다(upstream_rq_pending_overflow).
# 값 근거: 기준선 제출 동시 요청 Envoy 한 대당 최대 6(평상시 거절 0), Envoy 2대 합 16 < core 풀 합 20(다른 경로 몫이 남는다).
# Envoy 레플리카가 늘면 합계 상한도 늘어난다. 레플리카를 바꿀 때 이 값을 함께 본다(chaos/decisions/s1c-step2.md).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: submit-bulkhead
  namespace: prod
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: journey-core-submit }
  circuitBreaker:
    maxParallelRequests: 8
---
# S2' 단계 2: 조회 위주 경로 4개에만 게이트웨이 재시도를 건다. 제출(journey-core-submit)과 AI(journey-ai)는 중복 채점과
# 중복 호출 위험이 있어 제외한다. 재시도 조건은 요청이 업스트림 앱에 닿기 전에 실패한 경우로 한정한다.
# 주의: BackendTrafficPolicy의 재시도는 메서드로 제한할 수 없고, 위 라우트에는 메서드 매치가 없어 POST도 같은 정책을 받는다.
# journey-core-auth는 로그인 등 POST를, journey-major-core는 /api 전체 나머지(쓰기 포함)를 받는다. 재시도는 메서드로 제한할 수 없으므로
# 트리거를 connect-failure, refused-stream, reset-before-request로 한정한다. 셋 다 요청이 앱에 전달되기 전의 실패라 POST도 중복되지 않는다.
# reset(처리 중 끊김)과 503 재시도는 쓰기 요청을 중복시킬 수 있어 쓰지 않는다. 종료 중 끊김은 단계 1(preStop, 정상 종료)이 맡는다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: retry-read-routes
  namespace: prod
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: journey-core-auth }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: journey-core-problem }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: journey-major-battle }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: journey-major-core }
  retry:
    numRetries: 2
    retryOn:
      triggers: [connect-failure, refused-stream, reset-before-request]
    perRetry:
      timeout: 2s
      # 재시도가 한꺼번에 몰려 폭주하지 않도록 간격을 둔다.
      backOff:
        baseInterval: 100ms
        maxInterval: 1s

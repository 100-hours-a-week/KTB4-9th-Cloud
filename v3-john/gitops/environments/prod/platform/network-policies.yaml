apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosmos-judge-api
  namespace: prod
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: cosmos-judge-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-core }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-llm }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-make-problem }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-problem-batch }
      ports:
        - { protocol: TCP, port: 2358 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: judge-redis-queue }
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: judge-postgres }
      ports:
        - { protocol: TCP, port: 5432 }
---

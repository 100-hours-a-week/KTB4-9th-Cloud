---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosmos-ai-llm
  namespace: prod
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: cosmos-ai-llm }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-auth }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-core }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-battle }
      ports:
        - { protocol: TCP, port: 8000 }
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: ai-postgres }
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-core }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-judge-api }
      ports:
        - { protocol: TCP, port: 2358 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12]
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock: { cidr: 169.254.170.23/32 }
      ports:
        - { protocol: TCP, port: 80 }
---

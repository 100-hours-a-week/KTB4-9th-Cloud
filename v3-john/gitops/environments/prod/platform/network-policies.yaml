# 설계서 13장을 기준으로 코드 실제 호출을 반영한다. Battle·AI 평가 스케줄러가 모든 Spring 파드에서 돌아 AI 호출은 Spring 3개 모두 허용한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: prod
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: prod
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosmos-auth
  namespace: prod
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: cosmos-auth }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - ipBlock: { cidr: 10.30.20.0/23 }
      ports:
        - { protocol: TCP, port: 3306 }
        - { protocol: TCP, port: 6379 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12]
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-llm }
      ports:
        - { protocol: TCP, port: 8000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosmos-core
  namespace: prod
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: cosmos-core }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-problem-batch }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-llm }
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - ipBlock: { cidr: 10.30.20.0/23 }
      ports:
        - { protocol: TCP, port: 3306 }
        - { protocol: TCP, port: 6379 }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12]
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-llm }
      ports:
        - { protocol: TCP, port: 8000 }
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-judge-api }
      ports:
        - { protocol: TCP, port: 2358 }
---

            matchLabels: { app.kubernetes.io/name: cosmos-judge-api }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-judge-worker }
      ports:
        - { protocol: TCP, port: 6379 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: keda }
      ports:
        - { protocol: TCP, port: 6379 }

  namespace: prod
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ai-postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-llm }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-make-problem }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-problem-batch }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: cosmos-ai-migrate }

name: cosmos-core
component: core
image: 352635536602.dkr.ecr.ap-northeast-2.amazonaws.com/cosmos-v2/spring:approved-6bb76d7ccde9a513ba6f79fcc2497dd0c415461b
sourceRevision: ""
serviceAccount: core-sa
service: { name: core-service }
extraPorts: [{ name: management, port: 9091 }]
metrics: { enabled: true }
env:
  # S2' 단계 1: 종료 시 새 요청을 거절하고 진행 중 요청을 마친다(최대 20초). preStop 10초 + 20초 < 종료 유예 60초.
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 20s
  SPRING_PROFILES_ACTIVE: stage
  SPRING_CONFIG_IMPORT: optional:configtree:/mnt/secrets/
  # S1' 단계 3(2026-11-24): 채점 대기 제출이 풀을 다 잡지 않게 10에서 40으로. 근거 chaos/decisions/s1c-step3.md, 상한은 CI 연결 예산 검사
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "40"
  # S3a 단계 2: DB 연결을 30초(기본)가 아니라 3초만 기다리고 실패한다. 요청 스레드가 오래 묶이지 않는다.
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "3000"
  MANAGEMENT_SERVER_PORT: "9091"
  APP_REGION: ap-northeast-2
  APP_VERSION: v3
  FRONTEND_BASE_URL: https://john.cosmoscode.site
  KAKAO_REDIRECT_URI: https://john.cosmoscode.site/api/auth/oauth/kakao/callback
  SPRING_JPA_OPEN_IN_VIEW: "true"
  SENTRY_ENVIRONMENT: stage
  AI_SERVER_BASE_URL: http://ai-llm-service
  JUDGE0_BASE_URL: http://judge-api-service
  # 채점 이벤트는 outbox에 남았다가 다시 발행되므로 브로커 장애로 트래픽에서 빠지지 않게 준비 상태 검사에서 뺀다.
  SPRING_RABBITMQ_HOST: rabbitmq
  MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
  # S3a 단계 1: 준비 상태 검사(/actuator/health)에서 DB를 뺀다. DB가 끊겨도 DB가 필요 없는 요청은 계속 받는다.
  # /actuator/health/readiness는 앱 보안 설정이 401로 막아 쓸 수 없다(하위 경로 허용은 앱 코드 제안).
  MANAGEMENT_HEALTH_DB_ENABLED: "false"
secrets:
  - secret: cosmos/john/spring-config
    keys: { DB_URL: DB_URL }
  - secret: cosmos/john/main-db
    keys: { username: DB_USERNAME, password: DB_PASSWORD }
  - secret: cosmos/john/rabbitmq
    keys: { username: spring.rabbitmq.username, password: spring.rabbitmq.password }
  - secret: /cosmos-v2/stage/spring
    keys: { kakao_client_id: KAKAO_CLIENT_ID, kakao_client_secret: KAKAO_CLIENT_SECRET, kakao_redirect_uri: KAKAO_REDIRECT_URI, jwt_secret: JWT_SECRET }
resources:
  requests: { cpu: 500m, memory: 1Gi } # 실사용 30m 안팎(2026-11-23). 이중화 뒤 노드 3대에 들어가게 낮춤
  limits: { cpu: "2", memory: 2Gi }
probes:
  startupProbe: { tcpSocket: { port: 8080 }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 36 }
  readinessProbe: { httpGet: { path: /actuator/health, port: 9091 }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
  livenessProbe: { tcpSocket: { port: 8080 }, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
replicas: null # HPA가 관리
hpa: { enabled: true, min: 2, max: 3, cpu: 140 } # 요청 500m의 140% = 700m, 이전 기준(1코어의 70%)과 같은 값
otel: { enabled: true, agent: true, serviceName: cosmos-core }
rollout: { enabled: true } # S1 단계 4: 카나리 50% → 5분 분석 → 100%
pdb: { minAvailable: 1 }
spread: true
jvmOptions: -XX:MaxRAMPercentage=75
priorityClass: cosmos-core-journey # S2 단계 2
# S2' 단계 1: 엔드포인트에서 빠질 시간을 주고 SIGTERM을 보낸다. 이미지 베이스가 distroless면 sh가 없어 preStop이 실패하므로 확인이 필요하다(저장소에 Dockerfile이 없어 미확인).
preStopSleepSeconds: 10
shutdownPhaseSeconds: 20

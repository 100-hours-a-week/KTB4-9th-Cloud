name: cosmos-ai-llm
component: ai
image: 352635536602.dkr.ecr.ap-northeast-2.amazonaws.com/cosmos-v2/fastapi:approved-76f850ab691c3d8bafbca7b8aa4d51e285eaf9db
sourceRevision: ""
serviceAccount: ai-llm-sa
port: 8000
service: { name: ai-llm-service }
command: ["sh", "-c", 'for f in /mnt/secrets/[A-Z]*; do export "$(basename "$f")=$(cat "$f")"; done; exec uvicorn src.main:app --host 0.0.0.0 --port 8000']
env:
  DB_ECHO: "false"
  DB_PORT: "5432"
  DB_NAME: cosmos
  DB_HOST: ai-postgres
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  JUDGE0_URL: http://judge-api-service
  BACKEND_URL: http://core-service/api
  LANGSMITH_ENDPOINT: https://api.smith.langchain.com
  # 외부 443 송신을 막았으므로 LangSmith 추적도 끈다(보내지 못한 추적이 로그만 남긴다).
  LANGSMITH_TRACING: "false"
  LANGSMITH_PROJECT: cosmos-v3-john
  MOCK_LLM: "false"
  BATCH_ENABLED: "false"
  BATCH_TIMEZONE: Asia/Seoul
  BATCH_CONCURRENCY: "5"
  LOG_LEVEL: INFO
  # v3-john은 실제 Gemini를 부르지 않는다. SDK가 이 주소를 기본 주소로 쓴다(platform/fake-gemini.yaml).
  GOOGLE_GEMINI_BASE_URL: http://fake-gemini.prod.svc.cluster.local:8080
  # 실제 키를 가짜 서버에 보내지 않도록 시크릿 매핑에서 빼고 의미 없는 값을 둔다(SDK는 키가 있어야 클라이언트를 만든다).
  GEMINI_API_KEY: fake-gemini-key
secrets:
  - secret: /cosmos-v2/stage/ai-postgres
    keys: { username: DB_USER, password: DB_PASSWORD }
  - secret: /cosmos-v2/stage/fastapi
    keys: { langsmith_api_key: LANGSMITH_API_KEY, admin_token: ADMIN_TOKEN }
resources:
  requests: { cpu: 500m, memory: 512Mi }
  limits: { cpu: "1", memory: 1Gi }
probes:
  startupProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 2, timeoutSeconds: 2, failureThreshold: 30 }
  readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
  livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
replicas: null # HPA가 관리
hpa: { enabled: true, min: 1, max: 2, cpu: 70 }
otel: { enabled: true, agent: false, serviceName: cosmos-ai-llm }

# chart: grafana/tempo 1.24.4 (Tempo 2.9.0)
replicas: 1

tempo:
  reportingEnabled: false
  retention: 336h
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  resources:
    # 표본 100%와 k6 10 VU 부하에서 2Gi는 시작 시 WAL 재생 중 OOMKilled를 반복했다(2026-11-23).
    requests: { cpu: 250m, memory: 1536Mi }
    limits: { cpu: "1", memory: 4Gi }
  livenessProbe:
    httpGet: { path: /ready, port: 3200 }
    initialDelaySeconds: 300
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
    processor:
      service_graphs:
        wait: 10s
        max_items: 10000
      span_metrics:
        enable_target_info: true
    registry:
      collection_interval: 15s
      external_labels:
        cluster: cosmos-v3-john
        environment: john
    storage:
      path: /var/tempo/metrics
    traces_storage:
      path: /var/tempo/traces-wal
  overrides:
    defaults:
      metrics_generator:
        processors: [service-graphs, span-metrics]
  storage:
    trace:
      backend: s3
      s3:
        bucket: ""
        endpoint: s3.dualstack.ap-northeast-2.amazonaws.com
        region: ap-northeast-2
        insecure: false
      wal:
        path: /var/tempo/wal

# The deprecated chart renders legacy container ports, but Tempo only starts the
# OTLP listeners below. NetworkPolicy separately permits only 4317 from Collector.
config: |
  memberlist:
    cluster_label: "{{ .Release.Name }}.{{ .Release.Namespace }}"
  multitenancy_enabled: {{ .Values.tempo.multitenancyEnabled }}
  usage_report:
    reporting_enabled: {{ .Values.tempo.reportingEnabled }}
  compactor:
    compaction:
      block_retention: {{ .Values.tempo.retention }}
  distributor:
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: "0.0.0.0:4317" }
          http: { endpoint: "0.0.0.0:4318" }
  ingester:
    {{- toYaml .Values.tempo.ingester | nindent 4 }}
  server:
    {{- toYaml .Values.tempo.server | nindent 4 }}
  storage:
    {{- toYaml .Values.tempo.storage | nindent 4 }}
  querier:
    {{- toYaml .Values.tempo.querier | nindent 4 }}
  query_frontend:
    {{- toYaml .Values.tempo.queryFrontend | nindent 4 }}
  overrides:
    {{- toYaml .Values.tempo.overrides | nindent 4 }}
    {{- if .Values.tempo.metricsGenerator.enabled }}
  metrics_generator:
    processor:
      {{- toYaml .Values.tempo.metricsGenerator.processor | nindent 6 }}
    registry:
      {{- toYaml .Values.tempo.metricsGenerator.registry | nindent 6 }}
    storage:
      path: {{ .Values.tempo.metricsGenerator.storage.path | quote }}
      remote_write:
        - url: {{ .Values.tempo.metricsGenerator.remoteWriteUrl }}
    traces_storage:
      path: {{ .Values.tempo.metricsGenerator.traces_storage.path | quote }}
    {{- end }}

serviceAccount:
  create: true
  name: tempo-sa
  automountServiceAccountToken: true

serviceMonitor:
  enabled: true
  interval: 30s

persistence:
  enabled: true
  storageClassName: gp3-retain
  accessModes: [ReadWriteOnce]
  size: 10Gi

# S2 개선 단계 4: 온디맨드 monitoring 노드에 둔다(스팟 회수와 분리).
nodeSelector: { workload-class: monitoring }
tolerations:
  - { key: workload, operator: Equal, value: monitoring, effect: NoSchedule }

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true

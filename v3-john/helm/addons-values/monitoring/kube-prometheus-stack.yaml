# chart: prometheus-community/kube-prometheus-stack 92.18.0
# Grafana 관리자 계정은 Secret grafana-admin을 사용한다. Secret discord-webhook은 Secrets Manager cosmos/monitoring/discord-webhook 값이다.
kubeEtcd: { enabled: false }
kubeScheduler: { enabled: false }
kubeControllerManager: { enabled: false }
kubeProxy: { enabled: false }
prometheus:
  # Envoy 프록시가 사용자 요청을 모두 받으므로 서비스별 오류율과 지연 시간의 기준으로 쓴다.
  additionalPodMonitors:
    - name: envoy-proxy
      namespaceSelector:
        matchNames: [envoy-gateway-system]
      selector:
        matchLabels:
          app.kubernetes.io/component: proxy
          app.kubernetes.io/managed-by: envoy-gateway
      podMetricsEndpoints:
        - port: metrics
          path: /stats/prometheus
          interval: 15s
  prometheusSpec:
    # k6(클러스터 안 Job)가 실험 중 지표를 원격 쓰기로 보낸다(/api/v1/write).
    enableRemoteWriteReceiver: true
    retention: 15d
    retentionSize: 25GB
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 30Gi } }
alertmanager:
  config:
    # 웹훅이 하나라 채널은 같고, 등급별로 대기 시간과 반복 주기만 다르게 둔다.
    # critical은 사용자가 겪는 증상, warning은 원인 신호다.
    route:
      receiver: discord
      group_by: [alertname, namespace, journey]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # 2차 실험 S1' 단계 1 전까지 연결 예산 알림은 개선 전 조건을 유지하려고 어디로도 보내지 않는다. 단계 1에서 이 경로만 지운다.
        - receiver: blackhole
          matchers:
            - alertname=~"RdsConnectionBudgetHigh|DbConnectionAcquireFailed"
        # Watchdog은 항상 firing인 알림이다. 1시간마다 Discord에 오지 않으면 Prometheus나 Alertmanager 경로가 끊긴 것이다.
        - receiver: discord
          matchers:
            - alertname="Watchdog"
          group_wait: 10s
          repeat_interval: 1h
        - receiver: "null"
          matchers:
            - alertname="InfoInhibitor"
        - receiver: discord
          matchers:
            - severity="critical"
          group_wait: 10s
          group_interval: 2m
          repeat_interval: 1h
    # 원인 알림은 진단에 필요하므로 증상 알림이 떠 있어도 감추지 않는다. 노드가 죽으면 그 위 파드 단위 알림만 감춘다.
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = KubeNodeNotReady']
        target_matchers: ['alertname =~ KubePodNotReady|KubeDeploymentReplicasMismatch|KubeContainerWaiting|PodCrashLooping|PodsPending|DeploymentReplicasUnavailable']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: [namespace, alertname]
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: [namespace]
      - target_matchers: ['alertname = InfoInhibitor']
    receivers:
      - name: "null"
      - name: blackhole
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/discord-webhook/url
            send_resolved: true
            title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ with .CommonLabels.sev }}{{ . }} {{ end }}{{ .CommonLabels.alertname }}{{ with .CommonLabels.journey }} · {{ . }}{{ end }}'
            message: |-
              {{ range .Alerts }}• {{ .Annotations.summary }}{{ with .Annotations.description }}
                {{ . }}{{ end }}
              {{ end }}
  alertmanagerSpec:
    secrets: [discord-webhook]
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 200m, memory: 256Mi }
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-retain
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 2Gi } }
grafana:
  grafana.ini:
    server:
      root_url: https://grafana-john.cosmoscode.site
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  persistence:
    enabled: true
    storageClassName: gp3-retain
    size: 5Gi
  sidecar:
    dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: monitoring }
    datasources: { enabled: true, uid: prometheus-v2, name: Prometheus v2 }
  additionalDataSources:
    - name: Loki v2
      uid: loki-v2
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '(?:trace_id|traceId)[=:\" ]+([0-9a-f]{32})'
            datasourceUid: tempo-john
            url: '$${__value.raw}'
            urlDisplayLabel: View trace
    # S3a 단계 2: RDS 지표. Grafana 서비스 계정의 Pod Identity(읽기 전용)로 인증한다.
    - name: CloudWatch
      uid: cloudwatch
      type: cloudwatch
      access: proxy
      jsonData:
        authType: default
        defaultRegion: ap-northeast-2
    # 분산 트레이싱(S1 단계 2). 서비스 호출 지도는 Tempo metrics-generator가 Prometheus에 쓴 지표로 그린다.
    - name: Tempo John
      uid: tempo-john
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        httpMethod: GET
        nodeGraph: { enabled: true }
        serviceMap: { datasourceUid: prometheus-v2 }
        tracesToLogsV2:
          datasourceUid: loki-v2
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          filterByTraceID: true
          filterBySpanID: false
prometheusOperator:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
kube-state-metrics:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
prometheus-node-exporter:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
# 장애 주입 훈련용 SLO 기록 규칙과 알림(설계서 6장).
# SLI는 Envoy가 본 사용자 요청이다. HTTPRoute 이름(journey-<묶음>-<기능>)에서 journey와 route 라벨을 뽑는다.
# 오류는 업스트림 5xx와, 정상 엔드포인트가 없어 Envoy가 직접 503을 돌려준 요청(upstream_cx_none_healthy)을 더한다.
# 증상 알림은 severity critical(SEV1, SEV2)과 warning(SEV3), 원인 알림은 warning이다. sev 라벨에 제안 등급을 단다.
additionalPrometheusRulesMap:
  cosmos-slo:
    groups:
      - name: cosmos-slo.envoy
        interval: 30s
        rules:
          - record: cosmos:route_requests:rate5m
            expr: |
              label_replace(label_replace(
                sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/prod/journey-.+"}[5m]) or label_replace(rate(envoy_cluster_upstream_cx_none_healthy{envoy_cluster_name=~"httproute/prod/journey-.+"}[5m]), "src", "none_healthy", "", "")),
              "route", "$1", "envoy_cluster_name", "httproute/prod/([^/]+)/rule/.*"),
              "journey", "$1", "envoy_cluster_name", "httproute/prod/journey-([a-z]+).*")
          - record: cosmos:route_errors:rate5m
            expr: |
              label_replace(label_replace(
                sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/prod/journey-.+", envoy_response_code_class="5"}[5m]) or label_replace(rate(envoy_cluster_upstream_cx_none_healthy{envoy_cluster_name=~"httproute/prod/journey-.+"}[5m]), "src", "none_healthy", "", "")),
              "route", "$1", "envoy_cluster_name", "httproute/prod/([^/]+)/rule/.*"),
              "journey", "$1", "envoy_cluster_name", "httproute/prod/journey-([a-z]+).*")
          - record: cosmos:route_latency_p95_ms:rate5m
            expr: |
              label_replace(label_replace(
                histogram_quantile(0.95, sum by (envoy_cluster_name, le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~"httproute/prod/journey-.+"}[5m]))),
              "route", "$1", "envoy_cluster_name", "httproute/prod/([^/]+)/rule/.*"),
              "journey", "$1", "envoy_cluster_name", "httproute/prod/journey-([a-z]+).*")
          - record: cosmos:journey_error_ratio:rate5m
            expr: sum by (journey) (cosmos:route_errors:rate5m) / sum by (journey) (cosmos:route_requests:rate5m)
          # 조회 지연 SLO는 로그인과 문제 조회만 본다(제출, SSE처럼 원래 오래 걸리는 요청 제외).
          - record: cosmos:read_latency_p95_ms:rate5m
            expr: histogram_quantile(0.95, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~"httproute/prod/journey-core-(auth|problem)/.+"}[5m])))
      - name: cosmos-slo.windows
        interval: 1m
        rules:
          - record: cosmos:journey_error_ratio:rate30m
            expr: sum by (journey) (avg_over_time(cosmos:route_errors:rate5m[30m])) / sum by (journey) (avg_over_time(cosmos:route_requests:rate5m[30m]))
          - record: cosmos:journey_error_ratio:rate1h
            expr: sum by (journey) (avg_over_time(cosmos:route_errors:rate5m[1h])) / sum by (journey) (avg_over_time(cosmos:route_requests:rate5m[1h]))
          - record: cosmos:journey_error_ratio:rate6h
            expr: sum by (journey) (avg_over_time(cosmos:route_errors:rate5m[6h])) / sum by (journey) (avg_over_time(cosmos:route_requests:rate5m[6h]))
  cosmos-alerts:
    groups:
      - name: cosmos-symptoms
        rules:
          - alert: CoreUnavailable
            expr: (1 - cosmos:journey_error_ratio:rate5m{journey="core"}) < 0.5
            for: 1m
            labels: { severity: critical, sev: SEV1, namespace: prod }
            annotations:
              summary: "핵심 기능 성공률 {{ $value | humanizePercentage }} (로그인, 문제 조회, 제출)"
              description: "핵심 기능 요청의 절반 넘게 실패한다. 최근 배포, core·auth 파드, RDS 순서로 본다."
          # 핵심 SLO 99.5%. 1시간과 5분 창이 모두 14.4배(오류율 7.2%)를 넘으면 4주 예산의 2%를 1시간에 쓰는 속도다.
          - alert: CoreErrorBudgetBurnFast
            expr: |
              cosmos:journey_error_ratio:rate1h{journey="core"} > 0.072
              and cosmos:journey_error_ratio:rate5m{journey="core"} > 0.072
            for: 2m
            labels: { severity: critical, sev: SEV2, namespace: prod }
            annotations:
              summary: "핵심 기능이 에러 예산을 14.4배 넘는 속도로 소진 중 (1시간 오류율 {{ $value | humanizePercentage }})"
          # 설계서에 없는 보조 알림. 느리게 새는 장애를 잡는다.
          - alert: CoreErrorBudgetBurnSlow
            expr: |
              cosmos:journey_error_ratio:rate6h{journey="core"} > 0.03
              and cosmos:journey_error_ratio:rate30m{journey="core"} > 0.03
            for: 15m
            labels: { severity: warning, sev: SEV3, namespace: prod }
            annotations:
              summary: "핵심 기능이 6시간째 에러 예산을 6배 속도로 소진 중"
          - alert: MajorUnavailable
            expr: (1 - cosmos:journey_error_ratio:rate5m{journey="major"}) < 0.5
            for: 1m
            labels: { severity: critical, sev: SEV2, namespace: prod }
            annotations:
              summary: "주요 기능 성공률 {{ $value | humanizePercentage }} (배틀, 랭킹, 알림, 활동 기록)"
          # 2026-11-19 기준선(10 VU) Envoy p95 24~25ms의 2배. 기준선 3회를 다시 재면 그 p95의 2배로 맞춘다.
          - alert: ReadLatencyHigh
            expr: cosmos:read_latency_p95_ms:rate5m > 50
            for: 5m
            labels: { severity: critical, sev: SEV2, namespace: prod }
            annotations:
              summary: "로그인·문제 조회 p95 {{ $value | humanize }}ms"
          - alert: AiErrorRateHigh
            expr: cosmos:journey_error_ratio:rate5m{journey="ai"} > 0.05
            for: 5m
            labels: { severity: warning, sev: SEV3, namespace: prod }
            annotations:
              summary: "AI 기능 오류율 {{ $value | humanizePercentage }} (힌트, 풀이 평가)"
      # 채점 SLO는 k6가 원격 쓰기로 보낸 지표로 본다(제출부터 채점 결과까지 동기 응답). k6 시간 지표는 초 단위다.
      - name: cosmos-judge
        rules:
          - alert: JudgeTurnaroundHigh
            expr: max(k6_submit_latency_p95) > 30
            for: 5m
            labels: { severity: critical, sev: SEV2, namespace: prod }
            annotations:
              summary: "채점 처리 p95 {{ $value | humanize }}초, 목표 30초 초과 (k6 측정)"
          # 4xx 업무 거절(k6_submit_rejected_total)은 유실이 아니라 세지 않는다.
          - alert: JudgeJobLost
            expr: sum by (testid) (increase(k6_judge_lost_total[5m])) > 0
            labels: { severity: critical, sev: SEV1, namespace: prod }
            annotations:
              summary: "k6 제출 중 채점 결과를 받지 못한 건 {{ $value | humanize }}건 (5분, testid {{ $labels.testid }})"
              description: "5xx, 시간 초과, 결과 미완료가 포함된다. judge-api·judge-worker 로그와 core의 Judge 호출 구간을 본다."
      - name: cosmos-causes
        rules:
          - alert: PodCrashLooping
            expr: |
              (increase(kube_pod_container_status_restarts_total{namespace="prod"}[10m]) >= 3)
              or ((increase(kube_pod_container_status_restarts_total{namespace="prod"}[10m]) > 0)
                and on (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{namespace="prod", reason="OOMKilled"} == 1))
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} 컨테이너가 10분 동안 반복 재시작하거나 OOMKilled로 재시작"
              description: "kubectl -n prod describe pod {{ $labels.pod }}로 종료 사유를 보고, 최근 배포에서 메모리 limit이나 JVM 옵션이 바뀌었는지 확인한다."
          - alert: PodsPending
            expr: sum by (namespace, pod) (kube_pod_status_phase{namespace="prod", phase="Pending"}) > 0
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} 2분 넘게 Pending"
              description: "노드 용량, Cluster Autoscaler 로그, 스팟 재고를 확인한다."
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready", status="true"} == 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "노드 {{ $labels.node }} NotReady"
          - alert: DbConnectionPoolExhausted
            expr: max by (namespace, app, pod) (hikaricp_connections_pending{namespace="prod"}) > 0
            for: 1m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} Hikari 커넥션 대기 {{ $value }}건"
              description: "DB 응답 지연이나 커넥션 누수를 의심한다. RDS 연결 수와 CPU를 함께 본다."
          - alert: DeploymentReplicasUnavailable
            expr: |
              kube_deployment_status_replicas_available{namespace="prod"}
              < kube_deployment_spec_replicas{namespace="prod"}
            for: 2m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.deployment }} 가용 레플리카 {{ $value }}개, 원하는 수보다 적음"
          - alert: JvmHeapHigh
            expr: |
              sum by (namespace, app, pod) (jvm_memory_used_bytes{namespace="prod", area="heap"})
              / sum by (namespace, app, pod) (jvm_memory_max_bytes{namespace="prod", area="heap"} > 0) > 0.9
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} 힙 사용률 {{ $value | humanizePercentage }}"
          - alert: AppMetricsScrapeDown
            expr: up{namespace="prod", job=~"prod/cosmos-.*"} == 0
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.pod }} 앱 메트릭 수집 실패"
      - name: cosmos-delivery
        rules:
          - alert: ArgoAppDegraded
            expr: argocd_app_info{health_status="Degraded"} == 1
            for: 5m
            labels: { severity: warning, namespace: prod }
            annotations:
              summary: "Argo CD 앱 {{ $labels.name }} 상태 Degraded"
          - alert: ArgoSyncFailed
            expr: increase(argocd_app_sync_total{phase=~"Error|Failed"}[10m]) > 0
            labels: { severity: warning, namespace: prod }
            annotations:
              summary: "Argo CD 앱 {{ $labels.name }} 동기화 실패"
          - alert: ImageUpdaterErrors
            expr: sum by (application) (increase(argocd_image_updater_images_errors_total[15m])) > 0
            labels: { severity: warning, namespace: argocd }
            annotations:
              summary: "Image Updater가 {{ $labels.application }} 이미지 갱신에 실패"
              description: "argocd-image-updater 로그에서 ECR 인증, Git 쓰기 오류를 확인한다."
  # 2차 실험용 규칙. 타임아웃·연결 실패를 한 번만 세고 연결 실패 요청을 분모에 넣는 SLI와 DB 연결 알림이다.
  cosmos-round2:
    groups:
      - name: cosmos-round2.slo
        interval: 30s
        rules:
          # 2026-11-24 시험 경로 실측: Envoy는 요청 제한 시간 초과 504와 연결 실패 503을 이미 upstream_rq_xx 5xx에 올린다.
          # 그래서 오류는 1차 규칙(5xx + 정상 엔드포인트 없음) 그대로 세고, rq_timeout·cx_connect_fail을 더하지 않는다(두 번 세게 된다).
          # 대신 연결 실패 요청은 upstream_rq_total에 빠지므로 분모는 응답 코드별 합(upstream_rq_xx 전체)으로 잡는다.
          - record: cosmos:route_requests_all:rate5m
            expr: |
              sum by (route, journey) (label_replace(label_replace(
                sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/prod/journey-.+"}[5m]) or label_replace(rate(envoy_cluster_upstream_cx_none_healthy{envoy_cluster_name=~"httproute/prod/journey-.+"}[5m]), "src", "none_healthy", "", "")),
              "route", "$1", "envoy_cluster_name", "httproute/prod/([^/]+)/rule/.*"),
              "journey", "$1", "envoy_cluster_name", "httproute/prod/journey-([a-z]+).*"))
          - record: cosmos:route_errors_all:rate5m
            expr: sum by (route, journey) (cosmos:route_errors:rate5m)
          - record: cosmos:journey_error_ratio_all:rate5m
            expr: sum by (journey) (cosmos:route_errors_all:rate5m) / sum by (journey) (cosmos:route_requests_all:rate5m)
          - record: cosmos:db_connections:sum
            expr: sum(hikaricp_connections{namespace="prod"})
      - name: cosmos-round2.windows
        interval: 1m
        rules:
          - record: cosmos:journey_error_ratio_all:rate1h
            expr: sum by (journey) (avg_over_time(cosmos:route_errors_all:rate5m[1h])) / sum by (journey) (avg_over_time(cosmos:route_requests_all:rate5m[1h]))
      - name: cosmos-round2.symptoms
        rules:
          # 탐지 시간을 재는 기준 알림이다. CoreErrorBudgetBurnFast와 같은 임계값에 오류 기준만 넓혔다.
          - alert: CoreBurnFastAll
            expr: |
              cosmos:journey_error_ratio_all:rate1h{journey="core"} > 0.072
              and cosmos:journey_error_ratio_all:rate5m{journey="core"} > 0.072
            for: 2m
            labels: { severity: critical, sev: SEV1, namespace: prod }
            annotations:
              summary: "핵심 기능 오류율이 에러 예산을 14.4배 넘는 속도로 소진 중 (타임아웃과 연결 실패 포함)"
          # 어느 경로가 먼저 무너졌는지 보여 준다.
          - alert: ServiceErrorHigh
            expr: |
              cosmos:route_errors_all:rate5m
              / on (route, journey) cosmos:route_requests_all:rate5m > 0.05
            for: 2m
            labels: { severity: warning, sev: SEV2, namespace: prod }
            annotations:
              summary: "{{ $labels.route }} 오류율 {{ $value | humanizePercentage }}, 타임아웃과 연결 실패 포함"
      # S1' 단계 1의 개선이다. Alertmanager 경로에서 blackhole로 보내다가 단계 1에서 경로만 연다.
      - name: cosmos-round2-s1p-step1
        rules:
          - alert: RdsConnectionBudgetHigh
            # 303은 RDS max_connections 실측값이다(2026-11-24 SHOW VARIABLES). CI 검사 RDS_MAX_CONNECTIONS, core connectionGuard rdsMax와 같아야 한다.
            expr: cosmos:db_connections:sum / 303 > 0.8
            for: 1m
            labels: { severity: warning, sev: SEV2, namespace: prod }
            annotations:
              summary: "앱 전체 DB 연결 {{ with query \"cosmos:db_connections:sum\" }}{{ . | first | value | humanize }}{{ end }}개, RDS 최대 연결의 {{ $value | humanizePercentage }}"
          - alert: DbConnectionAcquireFailed
            expr: sum by (pod) (increase(hikaricp_connections_timeout_total{namespace="prod"}[2m])) > 0
            labels: { severity: warning, sev: SEV2, namespace: prod }
            annotations:
              summary: "{{ $labels.pod }}가 2분 동안 DB 연결을 얻지 못한 건 {{ $value | humanize }}건"

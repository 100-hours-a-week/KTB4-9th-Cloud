apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: prod
      namespace: prod
  hostnames:
    - grafana-v3.cosmoscode.site
  rules:
    - backendRefs:
        - { name: kube-prometheus-stack-grafana, port: 80 }

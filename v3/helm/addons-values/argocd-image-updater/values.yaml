# chart: argo/argocd-image-updater 1.4.2 (app v1.4.0)
replicaCount: 1

extraArgs:
  - --interval
  - 2m
  - --max-concurrency
  - "1"

extraEnv:
  - name: AWS_REGION
    value: ap-northeast-2
  - name: GIT_COMMIT_METHOD
    value: api

config:
  kube.events: true
  log.level: info
  registries:
    - name: Amazon ECR Seoul
      api_url: https://352635536602.dkr.ecr.ap-northeast-2.amazonaws.com
      prefix: 352635536602.dkr.ecr.ap-northeast-2.amazonaws.com
      ping: true
      insecure: false
      credentials: ext:/scripts/ecr-login.sh
      credsexpire: 10h

authScripts:
  enabled: true
  scripts:
    ecr-login.sh: |
      #!/bin/sh
      set -eu
      aws ecr get-authorization-token \
        --region "${AWS_REGION}" \
        --query 'authorizationData[0].authorizationToken' \
        --output text | base64 -d

serviceAccount:
  create: true
  name: argocd-image-updater

extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: argocd-image-updater-metrics-reader
      namespace: monitoring
  - apiVersion: v1
    kind: Secret
    metadata:
      name: argocd-image-updater-metrics-token
      namespace: monitoring
      annotations:
        kubernetes.io/service-account.name: argocd-image-updater-metrics-reader
    type: kubernetes.io/service-account-token
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: argocd-image-updater-prometheus-metrics-reader
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: '{{ include "argocd-image-updater.fullname" . }}-metrics-reader'
    subjects:
      - kind: ServiceAccount
        name: argocd-image-updater-metrics-reader
        namespace: monitoring

nodeSelector:
  workload-class: system

tolerations:
  - key: CriticalAddonsOnly
    operator: Exists

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

volumes:
  - name: aws-cli-cache
    emptyDir: {}

volumeMounts:
  - name: aws-cli-cache
    mountPath: /app/.aws

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    namespace: monitoring
    authorization:
      type: Bearer
      credentials:
        name: argocd-image-updater-metrics-token
        key: token

name: V3 Production Promote

on:
  workflow_dispatch:
    inputs:
      component:
        description: Production component to promote
        required: true
        type: choice
        options: [spring, fastapi]
      image_tag:
        description: 40-character source Git SHA
        required: true
        type: string
  repository_dispatch:
    types: [promote-v3]

permissions:
  contents: read
  id-token: write

concurrency:
  group: v3-promote-${{ inputs.component || github.event.client_payload.component }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: eks-prod
    env:
      AWS_REGION: ap-northeast-2
      COMPONENT: ${{ inputs.component || github.event.client_payload.component }}
      IMAGE_TAG: ${{ inputs.image_tag || github.event.client_payload.image_tag }}

    steps:
      - name: Resolve trusted component mapping
        env:
          EVENT_SOURCE_REPO: ${{ github.event.client_payload.repository }}
          EVENT_SOURCE_GITHUB_REPO: ${{ github.event.client_payload.source_repository }}
        run: |
          set -euo pipefail
          case "${COMPONENT}" in
            spring)
              expected_ecr=cosmos-v2/spring
              expected_github=100-hours-a-week/KTB4-9th-BE
              ;;
            fastapi)
              expected_ecr=cosmos-v2/fastapi
              expected_github=100-hours-a-week/KTB4-9th-AI
              ;;
            *) echo "::error::Unsupported component"; exit 1 ;;
          esac
          source_ecr="${EVENT_SOURCE_REPO:-${expected_ecr}}"
          source_github="${EVENT_SOURCE_GITHUB_REPO:-${expected_github}}"
          [[ "${source_ecr}" == "${expected_ecr}" && "${source_github}" == "${expected_github}" ]] || { echo "::error::Untrusted promotion mapping"; exit 1; }
          [[ "${IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a 40-character lowercase Git SHA"; exit 1; }
          echo "SOURCE_REPO=${source_ecr}" >>"${GITHUB_ENV}"
          echo "SOURCE_GITHUB_REPO=${source_github}" >>"${GITHUB_ENV}"
          echo "PROMOTION_BRANCH=promote/v3-${COMPONENT}" >>"${GITHUB_ENV}"

      - name: Create promotion GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CLOUD_GITHUB_APP_ID }}
          private-key: ${{ secrets.CLOUD_GITHUB_APP_PRIVATE_KEY }}
          owner: 100-hours-a-week
          repositories: |
            KTB4-9th-Cloud
            KTB4-9th-BE
            KTB4-9th-AI

      - name: Checkout Cloud main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.EKS_PROMOTE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read pending promotion revision
        run: |
          set -euo pipefail
          echo "BASE_MAIN_SHA=$(git rev-parse HEAD)" >>"${GITHUB_ENV}"
          if git fetch origin "${PROMOTION_BRANCH}:refs/remotes/origin/${PROMOTION_BRANCH}" 2>/dev/null; then
            case "${COMPONENT}" in
              spring) file=v3/gitops/environments/prod/auth.yaml ;;
              fastapi) file=v3/gitops/environments/prod/ai-llm.yaml ;;
            esac
            revision="$(git show "origin/${PROMOTION_BRANCH}:${file}" | awk '$1 == "sourceRevision:" { gsub(/"/, "", $2); print $2; exit }')"
            [[ -z "${revision}" ]] || echo "CURRENT_REVISION_OVERRIDE=${revision}" >>"${GITHUB_ENV}"
          fi

      - name: Validate and prepare promotion
        id: promotion
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash .github/scripts/promote-v3.sh

      - name: Open or update promotion PR
        if: steps.promotion.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIGEST: ${{ steps.promotion.outputs.digest }}
        run: |
          set -euo pipefail
          if git diff --quiet -- v3/gitops/environments/prod; then
            echo "::notice::GitOps already declares this digest."
            exit 0
          fi
          bash .github/scripts/publish-v3-branch.sh
          bash .github/scripts/upsert-v3-pr.sh

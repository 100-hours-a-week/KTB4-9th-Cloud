name: Terraform CI

on:
  pull_request:
  push:
    branches:
      - main
      - stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Terraform changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      v1: ${{ steps.changes.outputs.v1 }}
      v2_shared: ${{ steps.changes.outputs.v2_shared }}
      v2_stage: ${{ steps.changes.outputs.v2_stage }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            v1:
              - 'v1/**'
              - '.github/workflows/**'
            v2_shared:
              - 'v2/environments/shared/**'
              - 'v2/modules/shared/**'
              - 'v2/tests/**'
              - '.github/workflows/**'
            v2_stage:
              - 'v2/environments/stage/**'
              - 'v2/modules/environment/**'
              - 'v2/tests/**'
              - '.github/workflows/**'

  v1:
    name: Validate and plan v1
    needs: changes
    if: needs.changes.outputs.v1 == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Plan changes
        run: terraform plan -no-color -input=false

  v2-shared:
    name: Validate and plan v2 shared
    needs: changes
    if: needs.changes.outputs.v2_shared == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/environments/shared
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Check formatting
        run: terraform fmt -check -recursive . ../../modules/shared

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Run module tests
        working-directory: v2/modules/shared
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

      - name: Plan changes
        run: terraform plan -no-color -input=false

  v2-stage:
    name: Validate and plan v2 stage
    needs: changes
    if: needs.changes.outputs.v2_stage == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/environments/stage
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Check formatting
        run: terraform fmt -check -recursive . ../../modules/environment

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Run module tests
        working-directory: v2/modules/environment
        run: |
          terraform init -backend=false -input=false
          terraform test -no-color

      - name: Plan changes
        run: terraform plan -no-color -input=false

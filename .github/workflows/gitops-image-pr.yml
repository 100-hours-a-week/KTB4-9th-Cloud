name: GitOps image PR

# 훈련 클러스터(v3-john, v3-wade)의 이미지 해시를 ECR 기준으로 바꾸는 PR을 클러스터마다 따로 연다.
# 병합 후 해당 클러스터의 Argo CD에서 Sync하면 배포된다.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 대상 클러스터
        type: choice
        options: [both, john, wade]
        default: both
      tag:
        description: 이미지 태그. 비우면 저장소마다 가장 최근 이미지
        required: false
      services:
        description: 서비스 목록(쉼표 구분, 예 core,auth). 비우면 전체
        required: false
  repository_dispatch:
    # 앱 저장소에서 보낼 때: {"event_type":"image-pushed","client_payload":{"tag":"<sha>","services":"core,auth"}}
    types: [image-pushed]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  pr:
    name: Image PR (${{ matrix.env }})
    runs-on: ubuntu-latest
    environment: gitops-image-pr
    strategy:
      fail-fast: false
      matrix:
        env: [john, wade]
    env:
      TARGET: ${{ inputs.target || 'both' }}
      TAG: ${{ inputs.tag || github.event.client_payload.tag }}
      SERVICES: ${{ inputs.services || github.event.client_payload.services }}
    steps:
      - name: Skip other cluster
        id: gate
        run: echo "run=$([ "$TARGET" = both ] || [ "$TARGET" = "${{ matrix.env }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.gate.outputs.run == 'true'
        with:
          role-to-assume: arn:aws:iam::352635536602:role/cosmos-gitops-image-pr
          aws-region: ap-northeast-2

      - name: Update digests
        if: steps.gate.outputs.run == 'true'
        id: update
        env:
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          bash .github/scripts/update-image-digests.sh "${{ matrix.env }}" "$TAG" "$SERVICES"
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "body<<EOF"
            echo "v3-${{ matrix.env }} 이미지 해시 변경. 병합 후 v3-${{ matrix.env }} Argo CD에서 Sync한다."
            echo
            cat "$SUMMARY_FILE"
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        if: steps.gate.outputs.run == 'true'
        with:
          branch: gitops/v3-${{ matrix.env }}-images
          delete-branch: true
          add-paths: v3-${{ matrix.env }}/gitops/environments/prod/*.yaml
          commit-message: "chore(v3-${{ matrix.env }}): 이미지 해시 갱신"
          title: "chore(v3-${{ matrix.env }}): 이미지 해시 갱신${{ env.TAG && format(' ({0})', env.TAG) || '' }}"
          body: ${{ steps.update.outputs.body }}

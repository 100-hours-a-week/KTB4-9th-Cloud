name: GitOps CI

on:
  pull_request:
    paths:
      - "v3/gitops/**"
      - "v3-wade/gitops/**"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Render prod values
        run: |
          set -euo pipefail
          for values in v3/gitops/environments/prod/*.yaml v3-wade/gitops/environments/prod/*.yaml; do
            root="${values%%/gitops/*}"
            helm lint "$root/gitops/charts/cosmos-app" -f "$values"
            helm template check "$root/gitops/charts/cosmos-app" -n prod -f "$values" > /dev/null
          done

      - name: Reject mutable images
        run: |
          set -euo pipefail
          while read -r file image; do
            if [[ "${image}" =~ @sha256:[0-9a-f]{64}$ ]]; then
              continue
            fi
            if [[ "${image}" =~ ^352635536602\.dkr\.ecr\.ap-northeast-2\.amazonaws\.com/cosmos-v2/(spring|fastapi):approved-[0-9a-f]{40}$ ]]; then
              continue
            fi
            echo "::error file=${file}::digest 또는 approved-<40자리 SHA>로 고정하지 않은 이미지입니다: ${image}"
            exit 1
          done < <(awk '$1 == "image:" { print FILENAME, $2 }' \
            v3/gitops/environments/prod/*.yaml \
            v3-wade/gitops/environments/prod/*.yaml)
